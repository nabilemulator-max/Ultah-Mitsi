<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat kamu Mitsivany🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fly"></div>
<button id="mu" hidden>🎵 Putar lagu</button>

<!-- 0: pembuka -->
<section class="scene on">
  <div class="in">
    <div class="env">💌</div>
    <h1>This is for you my love<br>Mitsivany Abriela Imanda</h1>
    <button class="btn nx">Buka</button>
  </div>
</section>

<!-- 1: happy birthday -->
<section class="scene">
  <div class="in">
    <h1 id="hbd" class="big"></h1>
    <p class="mk nm" id="nm"></p>
    <p class="sub">semoga hari ini nggak ada yang bikin kamu sedih 🌻</p>
    <button class="btn nx">Lanjut</button>
  </div>
</section>

<!-- 2: pesan -->
<section class="scene">
  <div class="in">
    <h2>Pesan buat kamu</h2>
    <div class="note" id="note"><p id="pt"></p></div>
    <p class="hint" id="hint">klik si kertasnya buat lanjut</p>
    <button class="btn nx" id="nx2" hidden>Lanjut</button>
  </div>
</section>

<!-- 3: momen -->
<section class="scene">
  <div class="in wide">
    <h2>Momen - momen kita berdua!</h2>
    <div id="momen"></div>
    <button class="btn nx">Lanjut</button>
  </div>
</section>

<!-- 4: kue -->
<section class="scene">
  <div class="in">
    <h2>Make a wish dulu ya sayangku</h2>
    <div class="cake" id="cake">
      <div class="cn"><div class="cd"><i class="fl"></i></div><div class="cd"><i class="fl"></i></div><div class="cd"><i class="fl"></i></div></div>
      <div class="t t1"></div><div class="t t2"></div><div class="t t3"></div>
    </div>
    <button class="btn" id="blow">Tiup lilinnya, tiup lilinnya</button>
    <button class="btn nx" id="nx4" hidden>Lanjut</button>
  </div>
</section>

<!-- 5: surat -->
<section class="scene">
  <div class="in">
    <div class="note long"><p id="letter"></p></div>
    <p class="mk end">Happy birthday sayangku!!🌻</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
